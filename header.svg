<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3c72" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9fd3ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bgGrad)"/>

  <path fill="url(#waveGrad)">
    <animate attributeName="d"
      dur="6s" repeatCount="indefinite"
      values="
        M0,210 C250,150 950,270 1200,190 L1200,280 L0,280 Z;
        M0,190 C300,260 900,150 1200,220 L1200,280 L0,280 Z;
        M0,210 C250,150 950,270 1200,190 L1200,280 L0,280 Z" />
  </path>

  <path fill="#2a5298" opacity="0.35">
    <animate attributeName="d"
      dur="8s" repeatCount="indefinite"
      values="
        M0,240 C350,190 850,280 1200,230 L1200,280 L0,280 Z;
        M0,230 C350,270 850,190 1200,240 L1200,280 L0,280 Z;
        M0,240 C350,190 850,280 1200,230 L1200,280 L0,280 Z" />
  </path>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze" begin="0.2s" />
    <text x="600" y="120" font-family="Verdana, Arial, sans-serif" font-size="46" font-weight="bold" fill="url(#textGlow)" text-anchor="middle">Muhammad Abdul Majid</text>
    <text x="600" y="165" font-family="Verdana, Arial, sans-serif" font-size="19" fill="#a8d8ff" text-anchor="middle">Software Engineer • Web, AI &amp; IoT Solutions</text>
  </g>
</svg>
